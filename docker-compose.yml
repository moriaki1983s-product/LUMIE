version: "3.9"

services:
  client:
    build: ./client
    container_name: lumie-client
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - lumie-net

  server:
    build: ./server
    container_name: lumie-server
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ES_URL=http://elasticsearch:9200
    depends_on:
      - redis
      - elasticsearch
    networks:
      - lumie-net

  worker:
    build: ./server
    container_name: lumie-worker
    restart: unless-stopped
    command: celery -A celery_app.celery worker --loglevel=INFO
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ES_URL=http://elasticsearch:9200
    depends_on:
      - redis
      - elasticsearch
    networks:
      - lumie-net

  redis:
    image: redis:7-alpine
    container_name: lumie-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - lumie-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: lumie-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - lumie-net

  nginx:
    image: nginx:1.27-alpine
    container_name: lumie-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
    networks:
      - lumie-net

volumes:
  redis-data:
  es-data:

networks:
  lumie-net:
    driver: bridge
